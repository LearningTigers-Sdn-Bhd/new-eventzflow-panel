name: Next.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2 # Updated to v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Force bun to respect the platform-specific binaries for the runner
        run: bun install --frozen-lockfile

      - name: Add missing native binary (If rebuild fails)
        # This acts as a fallback specifically for the lightningcss error
        run: bun add lightningcss-linux-x64-gnu

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
